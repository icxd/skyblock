server:
    # Every server on the network needs its own name: it's how servers tell which one holds a
    # player's data.
    name: 'hub01a'
    port: 25565
    type: 'LOBBY'
mongodb:
    uri: 'mongodb://localhost:27017'
    database: 'dungeons'
npcs:
    # Where Ophelia (the Dungeon Hub's shop) stands: blocks from the world spawn's corner, facing
    # "yaw" (0 south, 90 west, 180 north, 270 east). On the Dungeon Hub's map (server.map:
    # dungeon_hub) she stands where Hypixel has her instead. For a place of her own, give "at",
    # e.g. at: {x: -49.5, y: 119.0, z: -9.5}.
    ophelia:
        from-spawn: {x: 4.5, y: 0.0, z: 0.5}
        yaw: 90.0
hypixel:
    # A Hypixel API key (developer.hypixel.net), for /yoinkprofile, which copies a real SkyBlock
    # profile onto yours. Left empty, the HYPIXEL_API_KEY environment variable is used.
    api-key: ''
    # Where Hypixel's API is; only to point /yoinkprofile at a stand-in to test with.
    api-url: 'https://api.hypixel.net/v2/'
